<!DOCTYPE html>

<html>
<head>
    <title>Facebook Login</title>

```
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f0f2f5;
    }

    .container {
        width: 900px;
        margin: 150px auto;
        display: flex;
        align-items: center;
        gap: 60px;
    }

    .left {
        width: 50%;
    }

    .logo {
        color: #1877f2;
        font-size: 55px;
        margin: 0;
    }

    .description {
        font-size: 25px;
    }

    .login-box {
        width: 350px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 10px #ccc;
    }

    input {
        width: 100%;
        padding: 15px;
        margin-bottom: 12px;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
    }

    .login {
        width: 100%;
        padding: 14px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .forgot {
        display: block;
        text-align: center;
        margin: 15px;
        color: #1877f2;
        text-decoration: none;
    }

    hr {
        border: 0;
        border-top: 1px solid #ddd;
    }

    .create {
        display: block;
        margin: 20px auto 0;
        padding: 14px 20px;
        background: #42b72a;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="left">
    <h1 class="logo">facebook</h1>
    <p class="description">
        Facebook helps you connect and share
        with the people in your life.
    </p>
</div>

<div class="login-box">

    <input type="text" placeholder="Email or phone number">

    <input type="text" placeholder="pasword">

    <button class="login">Log In</button>

    <a href="#" class="forgot">
        Forgotten text?
    </a>

    <hr>

    <button class="create">
        Create new account
    </button>

</div>
```

</div>

</body>
</html>
